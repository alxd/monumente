<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>3D Model Viewer</title>

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

	<style>
		/* ────────────────────────────────────────────────────────────
		   HIDE POTREE'S DEFAULT UI COMPLETELY
		   (HTML is left intact in the page, only visually hidden)
		   ──────────────────────────────────────────────────────────── */
		#potree_sidebar_container,
		#sidebar_root,
		#potree_quick_buttons,
		#potree_map_toggle,
		#potree_description,
		.potree_menu_toggle {
			display: none !important;
			visibility: hidden !important;
			pointer-events: none !important;
		}

		/* Push the Potree render area to the right of our custom sidebar */
		.potree_container {
			left: var(--panel-w) !important;
			width: calc(100% - var(--panel-w)) !important;
		}

		*, *::before, *::after { box-sizing: border-box; }

		:root {
			--bg: #0a0c0f;
			--panel: #0f1318;
			--border: #1e2530;
			--accent: #00c8ff;
			--accent2: #ff6b35;
			--accent3: #a855f7;
			--text: #c8d4e0;
			--text-dim: #4a5568;
			--active-bg: rgba(0, 200, 255, 0.08);
			--panel-w: 260px;
		}

		body {
			margin: 0;
			background: var(--bg);
			font-family: 'Rajdhani', sans-serif;
			color: var(--text);
			overflow: hidden;
			height: 100vh;
		}

		/* ── SIDEBAR (ported from tur.html) ── */
		#sidebar {
			position: fixed;
			left: 0; top: 0;
			width: var(--panel-w);
			height: 100vh;
			background: var(--panel);
			border-right: 1px solid var(--border);
			display: flex;
			flex-direction: column;
			z-index: 10;
			overflow-x: hidden;
			overflow-y: auto;
		}

		#sidebar::before {
			content: '';
			position: absolute;
			top: 0; left: 0; right: 0;
			height: 2px;
			background: linear-gradient(90deg, var(--accent), var(--accent2));
		}

		.sidebar-header {
			padding: 28px 20px 20px;
			border-bottom: 1px solid var(--border);
		}

		.sidebar-header .label {
			font-family: 'Share Tech Mono', monospace;
			font-size: 10px;
			letter-spacing: 3px;
			color: var(--accent);
			text-transform: uppercase;
			margin-bottom: 6px;
		}

		.sidebar-header h1 {
			font-size: 22px;
			font-weight: 700;
			letter-spacing: 1px;
			color: #fff;
			line-height: 1.1;
		}

		/* ── MODEL LIST ── */
		.section-title {
			font-family: 'Share Tech Mono', monospace;
			font-size: 9px;
			letter-spacing: 3px;
			color: var(--text-dim);
			text-transform: uppercase;
			padding: 20px 20px 10px;
		}

		#model-list {
			flex: 1 1 auto;
			min-height: 0;
			max-height: min(260px, 38vh);
			overflow-y: auto;
			padding: 0 12px;
		}

		/* ── Visible scrollbars (sidebar + model list) ── */
		#sidebar { scrollbar-width: thin; scrollbar-color: var(--accent) #11161d; }
		#sidebar::-webkit-scrollbar { width: 10px; }
		#sidebar::-webkit-scrollbar-track {
			background: #11161d;
			border-left: 1px solid var(--border);
		}
		#sidebar::-webkit-scrollbar-thumb {
			background: linear-gradient(180deg, var(--accent), var(--accent2));
			border-radius: 6px;
			border: 2px solid #11161d;
			box-shadow: 0 0 6px rgba(0, 200, 255, 0.4);
		}
		#sidebar::-webkit-scrollbar-thumb:hover {
			background: linear-gradient(180deg, var(--accent), var(--accent3));
		}

		#model-list { scrollbar-width: thin; scrollbar-color: var(--accent) #11161d; }
		#model-list::-webkit-scrollbar { width: 8px; }
		#model-list::-webkit-scrollbar-track {
			background: #11161d;
			border-radius: 4px;
		}
		#model-list::-webkit-scrollbar-thumb {
			background: var(--accent);
			border-radius: 4px;
			border: 2px solid #11161d;
			box-shadow: 0 0 4px rgba(0, 200, 255, 0.5);
		}
		#model-list::-webkit-scrollbar-thumb:hover { background: var(--accent3); }

		.model-btn {
			display: flex;
			align-items: center;
			gap: 12px;
			width: 100%;
			padding: 12px 14px;
			margin-bottom: 4px;
			background: transparent;
			border: 1px solid transparent;
			border-radius: 6px;
			cursor: pointer;
			color: var(--text);
			font-family: 'Rajdhani', sans-serif;
			font-size: 16px;
			font-weight: 500;
			letter-spacing: 0.5px;
			text-align: left;
			transition: all 0.2s ease;
			position: relative;
			overflow: hidden;
		}

		.model-btn::before {
			content: '';
			position: absolute;
			left: 0; top: 0; bottom: 0;
			width: 2px;
			background: var(--accent);
			transform: scaleY(0);
			transition: transform 0.2s ease;
		}

		.model-btn.person-btn::before { background: var(--accent3); }
		.model-btn.cloud-btn::before  { background: var(--accent2); }

		.model-btn:hover {
			background: var(--active-bg);
			border-color: var(--border);
			color: #fff;
		}

		.model-btn.active {
			background: var(--active-bg);
			border-color: rgba(0, 200, 255, 0.25);
			color: var(--accent);
		}

		.model-btn.person-btn.active {
			border-color: rgba(168, 85, 247, 0.3);
			color: var(--accent3);
			background: rgba(168, 85, 247, 0.07);
		}

		.model-btn.cloud-btn.active {
			border-color: rgba(255, 107, 53, 0.35);
			color: var(--accent2);
			background: rgba(255, 107, 53, 0.07);
		}
		.model-btn.cloud-btn.active .icon { background: rgba(255, 107, 53, 0.15); }
		.model-btn.cloud-btn.active .sub  { color: rgba(255, 107, 53, 0.55); }

		.model-btn.active::before { transform: scaleY(1); }

		.model-btn .icon {
			width: 32px;
			height: 32px;
			border-radius: 6px;
			background: var(--border);
			display: flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
			font-size: 15px;
			transition: background 0.2s;
		}

		.model-btn.active .icon            { background: rgba(0, 200, 255, 0.15); }
		.model-btn.person-btn.active .icon { background: rgba(168, 85, 247, 0.15); }

		.model-btn .name { flex: 1; }

		.model-btn .sub {
			font-size: 11px;
			color: var(--text-dim);
			font-weight: 300;
			display: block;
			line-height: 1;
			margin-top: 2px;
		}

		.model-btn.active .sub             { color: rgba(0, 200, 255, 0.5); }
		.model-btn.person-btn.active .sub  { color: rgba(168, 85, 247, 0.5); }

		/* ── CONTROLS SECTION ── */
		.controls-section {
			flex-shrink: 0;
			border-top: 1px solid var(--border);
			padding: 16px 20px 20px;
		}

		.toggle-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px 0;
		}

		.toggle-label { display: flex; flex-direction: column; }
		.toggle-label span  { font-size: 15px; font-weight: 500; color: var(--text); }
		.toggle-label small { font-size: 11px; color: var(--text-dim); font-weight: 300; }

		.toggle {
			position: relative;
			width: 44px; height: 24px;
			flex-shrink: 0;
		}

		.toggle input { opacity: 0; width: 0; height: 0; }

		.toggle-track {
			position: absolute;
			inset: 0;
			background: var(--border);
			border-radius: 24px;
			cursor: pointer;
			transition: background 0.25s;
		}

		.toggle-track::after {
			content: '';
			position: absolute;
			left: 3px; top: 3px;
			width: 18px; height: 18px;
			background: var(--text-dim);
			border-radius: 50%;
			transition: transform 0.25s, background 0.25s;
		}

		.toggle input:checked + .toggle-track {
			background: rgba(0, 200, 255, 0.2);
			border: 1px solid rgba(0, 200, 255, 0.4);
		}

		.toggle input:checked + .toggle-track::after {
			transform: translateX(20px);
			background: var(--accent);
			box-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
		}

		#walk-toggle:checked + .toggle-track {
			background: rgba(168, 85, 247, 0.2);
			border: 1px solid rgba(168, 85, 247, 0.4);
		}
		#walk-toggle:checked + .toggle-track::after {
			background: var(--accent3);
			box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
		}

		#walk-controls {
			display: none;
			padding: 10px 0 0;
			border-top: 1px solid var(--border);
			margin-top: 4px;
		}
		#walk-controls.visible { display: block; }

		.slider-row {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 4px 0 6px;
		}

		.slider-row label {
			font-size: 13px;
			color: var(--text-dim);
			white-space: nowrap;
			font-weight: 300;
		}

		input[type=range] {
			flex: 1;
			accent-color: var(--accent3);
			cursor: pointer;
		}

		#walk-speed-val {
			font-family: 'Share Tech Mono', monospace;
			font-size: 11px;
			color: var(--accent3);
			width: 24px;
			text-align: right;
		}

		#model-scale-val {
			font-family: 'Share Tech Mono', monospace;
			font-size: 11px;
			color: var(--accent);
			width: 36px;
			text-align: right;
		}

		#person-chroma-panel {
			display: none;
			visibility: visible;
			padding: 6px 10px 7px;
			margin: 8px 0 10px;
			border-radius: 6px;
			border: 1px solid rgba(0, 200, 255, 0.35);
			background: rgba(0, 200, 255, 0.07);
			box-shadow: inset 0 0 0 1px rgba(0, 200, 255, 0.08);
		}
		#person-chroma-panel.visible { display: block; }

		#person-chroma-panel .chroma-panel-title {
			font-family: 'Share Tech Mono', monospace;
			font-size: 9px;
			letter-spacing: 2px;
			color: var(--accent);
			text-transform: uppercase;
			margin-bottom: 5px;
		}

		#person-video-panel {
			display: none;
			padding: 6px 0 8px;
		}
		#person-video-panel.visible { display: block; }

		.person-video-heading {
			font-family: 'Share Tech Mono', monospace;
			font-size: 9px;
			letter-spacing: 2px;
			color: var(--accent3);
			text-transform: uppercase;
			margin-bottom: 10px;
		}

		#person-video-panel > label {
			display: block;
			font-size: 13px;
			color: var(--text-dim);
			font-weight: 300;
			margin-bottom: 8px;
		}

		#person-video-panel .slider-row input[type=range] { accent-color: var(--accent3); }

		#person-video-scale-val {
			font-family: 'Share Tech Mono', monospace;
			font-size: 11px;
			color: var(--accent3);
			width: 36px;
			text-align: right;
		}

		.person-video-buttons {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
		}

		.person-video-btn {
			flex: 1;
			min-width: 0;
			padding: 0;
			border: 2px solid var(--border);
			border-radius: 8px;
			background: #0a0d12;
			cursor: pointer;
			overflow: hidden;
			transition: border-color 0.2s, box-shadow 0.2s;
		}

		.person-video-btn:hover { border-color: rgba(0, 200, 255, 0.35); }

		.person-video-btn.active {
			border-color: var(--accent);
			box-shadow: 0 0 0 1px rgba(0, 200, 255, 0.25);
		}

		.person-video-btn video {
			display: block;
			width: 100%;
			height: 52px;
			object-fit: cover;
			pointer-events: none;
			background: #050608;
		}

		.person-video-btn .pv-caption {
			display: block;
			font-size: 10px;
			letter-spacing: 0.5px;
			color: var(--text-dim);
			padding: 5px 6px 6px;
			text-align: center;
			line-height: 1.2;
			font-weight: 500;
		}

		.person-video-btn.active .pv-caption { color: var(--accent); }

		.chroma-mode-buttons {
			display: flex;
			gap: 5px;
			flex-wrap: nowrap;
			margin-top: 0;
		}

		.chroma-mode-btn {
			flex: 1 1 0;
			min-width: 0;
			min-height: 22px;
			padding: 3px 4px;
			border-radius: 4px;
			border: 1px solid rgba(255, 255, 255, 0.18);
			background: #131920;
			color: #e8eef5;
			font-family: 'Rajdhani', sans-serif;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.3px;
			cursor: pointer;
			transition: border-color 0.2s, color 0.2s, background 0.2s;
		}

		.chroma-mode-btn:hover {
			border-color: rgba(0, 200, 255, 0.35);
			color: var(--text);
		}

		.chroma-mode-btn.active {
			border-color: var(--accent);
			color: var(--accent);
			background: rgba(0, 200, 255, 0.06);
		}

		#model-scale-row input[type=range] { accent-color: var(--accent); }

		/* ── Hide / show video toggle (sits right under Auto Rotate) ── */
		.hide-video-btn {
			display: none;
			width: 100%;
			margin: 6px 0 0;
			padding: 9px 12px;
			border-radius: 6px;
			border: 1px solid rgba(255, 107, 53, 0.45);
			background: rgba(255, 107, 53, 0.08);
			color: var(--accent2);
			font-family: 'Rajdhani', sans-serif;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 1.5px;
			text-transform: uppercase;
			cursor: pointer;
			transition: all 0.2s;
		}
		.hide-video-btn.visible { display: block; }
		.hide-video-btn:hover {
			background: rgba(255, 107, 53, 0.18);
			box-shadow: 0 0 8px rgba(255, 107, 53, 0.35);
			color: #fff;
		}
		.hide-video-btn.hidden-state {
			background: rgba(255, 107, 53, 0.25);
			color: #fff;
			border-color: var(--accent2);
			box-shadow: 0 0 10px rgba(255, 107, 53, 0.45);
		}

		/* ── AUDIO PLAYER ── */
		.audio-row {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 8px 0 4px;
			border-top: 1px solid var(--border);
			margin-top: 6px;
		}

		.audio-play-btn {
			width: 32px; height: 32px;
			border-radius: 50%;
			background: rgba(168, 85, 247, 0.12);
			border: 1px solid rgba(168, 85, 247, 0.35);
			color: var(--accent3);
			font-size: 13px;
			cursor: pointer;
			display: flex; align-items: center; justify-content: center;
			flex-shrink: 0;
			transition: all 0.2s;
		}

		.audio-play-btn:hover {
			background: rgba(168, 85, 247, 0.25);
			box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
		}

		.audio-play-btn.playing {
			background: rgba(168, 85, 247, 0.2);
			border-color: var(--accent3);
			box-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
		}

		.audio-info { flex: 1; min-width: 0; }

		.audio-info .audio-name {
			font-size: 12px;
			font-weight: 500;
			color: var(--text);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.audio-info .audio-status {
			font-family: 'Share Tech Mono', monospace;
			font-size: 9px;
			letter-spacing: 1px;
			color: var(--text-dim);
			margin-top: 1px;
		}

		.audio-info .audio-status.active { color: var(--accent3); }

		#audio-vol {
			accent-color: var(--accent3);
			width: 56px;
			cursor: pointer;
			flex-shrink: 0;
		}

		/* ── STATUS BAR ── */
		#status {
			font-family: 'Share Tech Mono', monospace;
			font-size: 10px;
			letter-spacing: 1px;
			padding: 10px 20px 14px;
			color: var(--text-dim);
			border-top: 1px solid var(--border);
		}

		#status .dot {
			display: inline-block;
			width: 6px; height: 6px;
			border-radius: 50%;
			background: var(--text-dim);
			margin-right: 6px;
			vertical-align: middle;
			transition: background 0.3s;
		}

		#status.loading .dot { background: var(--accent2); animation: pulse 0.8s infinite; }
		#status.ready   .dot { background: #44ff88; }
		#status.error   .dot { background: #ff4444; }

		@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.2} }

		/* ── OVERLAY CANVAS (chroma video / GLB models, drawn on top of Potree) ── */
		#overlay-canvas-wrap {
			position: fixed;
			left: var(--panel-w);
			top: 0; right: 0; bottom: 0;
			pointer-events: none;
			z-index: 5;
		}

		#overlay-canvas-wrap canvas {
			display: block;
			width: 100% !important;
			height: 100% !important;
			background: transparent;
		}

		/* ── OVERLAYS ── */
		#model-name-overlay {
			position: fixed;
			bottom: 32px;
			left: calc(var(--panel-w) + 32px);
			font-family: 'Share Tech Mono', monospace;
			font-size: 11px;
			letter-spacing: 3px;
			text-transform: uppercase;
			color: rgba(255,255,255,0.35);
			pointer-events: none;
			z-index: 11;
		}

		#loader-overlay {
			position: fixed;
			left: var(--panel-w);
			top: 0; right: 0; bottom: 0;
			background: rgba(10, 12, 15, 0.65);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 8;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.3s;
		}
		#loader-overlay.visible { opacity: 1; }

		.loader-inner { text-align: center; }
		.loader-ring {
			width: 48px; height: 48px;
			border: 2px solid var(--border);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin: 0 auto 16px;
		}
		@keyframes spin { to { transform: rotate(360deg) } }
		.loader-text {
			font-family: 'Share Tech Mono', monospace;
			font-size: 11px; letter-spacing: 3px; color: var(--text-dim);
		}
	</style>
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>


	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

	<!-- INCLUDE ADDITIONAL DEPENDENCIES HERE -->
	<!-- INCLUDE SETTINGS HERE -->

	<!-- Potree container is kept intact (its sidebar is hidden via CSS above) -->
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background: #000;"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<!-- ─────────── CUSTOM SIDEBAR (ported from tur.html) ─────────── -->
	<div id="sidebar">
		<div class="sidebar-header">
			<div class="label"></div>
			<h1>3D<br>Viewer</h1>
		</div>

		<div class="section-title">Models</div>

		<div id="model-list">
			<button class="model-btn cloud-btn" data-name="Agriculture" data-type="agriculture">
				<div class="icon">☁</div>
				<div class="name">Agriculture<span class="sub">point cloud · sigeom</span></div>
			</button>
			<button class="model-btn person-btn"
					data-name="Monument"
					data-type="monument"
					data-model="./models/statuie_florilor.glb">
				<div class="icon">◈</div>
				<div class="name">Monument<span class="sub">video + statue</span></div>
			</button>
		</div>

		<div class="controls-section">
			<div class="section-title" style="padding:0 0 8px;">Controls</div>

			<div class="toggle-row">

	<!-- ─────────── OVERLAY: Chroma video + GLB models on top of Potree ─────────── -->
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
		}
	}
	</script>

	<script type="module">
	import * as THREE from 'three';
	import { GLTFLoader }     from 'three/addons/loaders/GLTFLoader.js';
	import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

	// ── BLOB-URL TEXTURE FIX ───────────────────────────────────
	// ROOT CAUSE (confirmed from GLTFLoader r160 source code):
	//
	// For GLBs with embedded textures, loadImageSource() does:
	//   1. getDependency('bufferView') → new Blob([data]) → URL.createObjectURL(blob)
	//   2. loader.load(blobUrl, ...)   ← ImageBitmapLoader.load(), schedules fetch(blobUrl)
	//   3. URL.revokeObjectURL(blobUrl) ← called in the SAME .finally() chain
	//
	// Step 3 runs before fetch() even starts (same microtask queue), so the
	// blob URL is already dead when ImageBitmapLoader tries to fetch it.
	// This explains both the error AND the intermittency (timing varies by load).
	//
	// THE FIX: intercept URL.createObjectURL to keep the raw Blob. When
	// revokeObjectURL is called, don't actually free it — store the Blob.
	// When fetch() is called on a "revoked" URL, transparently re-create
	// the blob URL from the stored Blob, fetch it, then truly release it.
	(function fixGltfBlobTextures() {
		if (URL.__gltfBlobFixed) return;
		URL.__gltfBlobFixed = true;

		const _live    = new Map(); // blobUrl → Blob (created, not yet revoked)
		const _revoked = new Map(); // blobUrl → Blob (revoked early, fetch pending)

		// Remember every Blob registered via createObjectURL
		const _origCreate = URL.createObjectURL.bind(URL);
		URL.createObjectURL = function(obj) {
			const url = _origCreate(obj);
			if (obj instanceof Blob && url) _live.set(url, obj);
			return url;
		};

		// Soft-revoke: save the Blob instead of releasing it immediately
		URL._origRevoke = URL.revokeObjectURL.bind(URL);
		URL.revokeObjectURL = function(url) {
			if (typeof url === 'string' && _live.has(url)) {
				_revoked.set(url, _live.get(url));
				_live.delete(url);
				// Don't call _origRevoke — keep the URL alive until fetch() uses it
				return;
			}
			URL._origRevoke(url);
		};

		// Intercept fetch: if the URL was already soft-revoked, re-create it
		const _origFetch = window.fetch.bind(window);
		window.fetch = function(input, init) {
			const url = typeof input === 'string' ? input
				: (input instanceof Request) ? input.url : null;

			if (url && _revoked.has(url)) {
				// Re-create a fresh blob URL from the saved Blob
				const blob   = _revoked.get(url);
				_revoked.delete(url);
				const fresh  = _origCreate(blob);
				return _origFetch(fresh, init).then(
					res => { URL._origRevoke(fresh); return res; },
					err => { URL._origRevoke(fresh); return Promise.reject(err); }
				);
			}
			// For URLs still in _live, remove from tracking once fetch starts
			if (url && _live.has(url)) _live.delete(url);
			return _origFetch(input, init);
		};
	})();

	/** Resolve ./models/... against this HTML URL */
	function resolveHref(relPath) {
		try { return new URL(relPath, import.meta.url).href; }
		catch (_) { return relPath; }
	}

	// ── Wait for Potree viewer to be ready ─────────────────────
	function whenViewerReady(cb) {
		const ok = () => window.viewer
			&& window.viewer.scene
			&& typeof window.viewer.scene.getActiveCamera === 'function'
			&& window.viewer.scene.getActiveCamera();
		if (ok()) { cb(); return; }
		const t = setInterval(() => { if (ok()) { clearInterval(t); cb(); } }, 60);
	}

	whenViewerReady(initOverlay);

	function initOverlay() {

	// ── OVERLAY SCENE ──────────────────────────────────────────
	const wrap = document.getElementById('overlay-canvas-wrap');
	const overlayScene = new THREE.Scene();
	overlayScene.background = null;

	const overlayCamera = new THREE.PerspectiveCamera(
		60,
		wrap.clientWidth / Math.max(1, wrap.clientHeight),
		0.01, 100000
	);

	const overlayRenderer = new THREE.WebGLRenderer({
		alpha: true,
		antialias: true,
		powerPreference: 'high-performance'
	});
	THREE.ColorManagement.enabled = true;
	overlayRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
	overlayRenderer.setSize(wrap.clientWidth, wrap.clientHeight);
	overlayRenderer.setClearColor(0x000000, 0);
	overlayRenderer.outputColorSpace = THREE.SRGBColorSpace;
	overlayRenderer.toneMapping = THREE.ACESFilmicToneMapping;
	overlayRenderer.toneMappingExposure = 1.2;
	wrap.appendChild(overlayRenderer.domElement);

	// Up-axis correction: Potree's point cloud world is Z-up, but our GLB / chroma plane
	// content is authored Y-up. Everything overlay-related goes inside `overlayRoot`,
	// whose +90° X rotation maps the inner Y-up local frame onto the outer Z-up world.
	const overlayRoot = new THREE.Group();
	overlayRoot.rotation.x = Math.PI / 2;
	overlayScene.add(overlayRoot);

	/** Convert a Z-up world position into overlayRoot's Y-up local frame. */
	function worldToOverlayLocal(worldPos) {
		return new THREE.Vector3(worldPos.x, worldPos.z, -worldPos.y);
	}

	/** Hide every Potree point cloud so the overlay model stands alone on a black background. */
	function hidePotreePointclouds() {
		try {
			const pcs = window.viewer.scene.pointclouds;
			if (pcs && pcs.length) pcs.forEach(pc => { pc.visible = false; });
		} catch (_) {}
	}

	/** Show every Potree point cloud again (used for testing / future "back to cloud" button). */
	function showPotreePointclouds() {
		try {
			const pcs = window.viewer.scene.pointclouds;
			if (pcs && pcs.length) pcs.forEach(pc => { pc.visible = true; });
		} catch (_) {}
	}

	// ── AUTOPLAY UNLOCK ───────────────────────────────────────
	// Edge / Safari sometimes refuse to autoplay even a muted <video> on the
	// very first page-load (especially after a service-worker / hard reload).
	// We register a single-shot pointer/key listener at the window level: as
	// soon as the user clicks ANYWHERE (a menu item, the canvas, anywhere),
	// every queued callback is fired, which is each active video's `play()`.
	const _autoplayUnlockCallbacks = [];
	let _autoplayUnlocked = false;
	function _runAutoplayUnlocks() {
		_autoplayUnlocked = true;
		const cbs = _autoplayUnlockCallbacks.splice(0);
		cbs.forEach(cb => { try { cb(); } catch (_) {} });
	}
	['pointerdown', 'click', 'keydown', 'touchstart'].forEach(evt => {
		window.addEventListener(evt, _runAutoplayUnlocks, { once: true, capture: true });
	});
	function registerAutoplayUnlock(cb) {
		if (_autoplayUnlocked) { try { cb(); } catch (_) {} return; }
		_autoplayUnlockCallbacks.push(cb);
	}

	// ── POTREE CLOUD AUTO-ROTATION ────────────────────────────
	// Potree's pointcloud is a THREE.Object3D. Its local origin is at the cloud's
	// octree corner — using `pc.rotation.z` would tumble the cloud around that
	// corner ("moving in a circle"). Instead we accumulate an angle and apply it
	// each frame as `T(+P) * R(angle) * T(-P) * M_original`, where P is the
	// world-space center of the cloud's bounding box. matrixAutoUpdate is turned
	// off so Potree won't stomp on our matrix.
	function rotatePotreePointcloudsAroundCenter(angleDelta) {
		try {
			const pcs = window.viewer && window.viewer.scene && window.viewer.scene.pointclouds;
			if (!pcs || !pcs.length) return;
			const T1 = new THREE.Matrix4();
			const R  = new THREE.Matrix4();
			const T2 = new THREE.Matrix4();
			for (const pc of pcs) {
				if (!pc.visible) continue;
				if (!pc.userData._spinInit) {
					const bbox = pc.boundingBox || (pc.pcoGeometry && pc.pcoGeometry.boundingBox);
					if (!bbox) continue;
					pc.updateMatrixWorld(true);
					const localCenter = new THREE.Vector3();
					bbox.getCenter(localCenter);
					const worldCenter = localCenter.applyMatrix4(pc.matrixWorld);
					pc.userData._spinInit    = true;
					pc.userData._spinPivot   = worldCenter;
					pc.userData._spinAngle   = 0;
					pc.userData._spinBaseMat = pc.matrix.clone();
					pc.matrixAutoUpdate = false;
				}
				pc.userData._spinAngle += angleDelta;
				const P = pc.userData._spinPivot;
				T1.makeTranslation(-P.x, -P.y, -P.z);
				R.makeRotationZ(pc.userData._spinAngle);
				T2.makeTranslation( P.x,  P.y,  P.z);
				pc.matrix.copy(pc.userData._spinBaseMat);
				pc.matrix.premultiply(T1);
				pc.matrix.premultiply(R);
				pc.matrix.premultiply(T2);
				pc.updateMatrixWorld(true);
			}
		} catch (_) {}
	}

	// Restore each pointcloud's original (un-rotated) transform. Called when
	// re-entering Agriculture so a previously-spun cloud doesn't appear tilted.
	function resetPotreePointcloudsRotation() {
		try {
			const pcs = window.viewer && window.viewer.scene && window.viewer.scene.pointclouds;
			if (!pcs || !pcs.length) return;
			for (const pc of pcs) {
				if (pc.userData._spinBaseMat) {
					pc.matrix.copy(pc.userData._spinBaseMat);
					pc.matrixAutoUpdate = true;
					pc.updateMatrixWorld(true);
					pc.userData._spinInit = false;
					pc.userData._spinAngle = 0;
					delete pc.userData._spinBaseMat;
					delete pc.userData._spinPivot;
				}
			}
		} catch (_) {}
	}

	// Keep THREE.Cache ON so parsed GLB data is reused on re-click and textures
	// aren't decoded twice. The deferred-revoke patch above ensures blob: URLs
	// remain valid for the full duration of the image decode, so cached entries
	// are also safe to re-use.
	THREE.Cache.enabled = true;

	// IBL environment for GLB MeshStandardMaterial (PBR).
	// Without this, GLB materials with even moderate metalness render nearly flat —
	// the diffuse map appears washed out / "untextured" because the specular term
	// has nothing to reflect. RoomEnvironment is a tiny synthetic indoor scene that
	// PMREM bakes into a prefiltered cubemap; assigning it as scene.environment
	// gives every PBR material proper indirect lighting for free.
	const pmremGenerator = new THREE.PMREMGenerator(overlayRenderer);
	pmremGenerator.compileEquirectangularShader();
	overlayScene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
	pmremGenerator.dispose();

	// Lighting (analytical lights add direction/contrast on top of the IBL fill)
	overlayRoot.add(new THREE.AmbientLight(0xffffff, 0.4));
	overlayRoot.add(new THREE.HemisphereLight(0xffffff, 0x444466, 0.5));
	const key = new THREE.DirectionalLight(0xffffff, 2.0);
	key.position.set(5, 8, 5);
	overlayRoot.add(key);
	const fill = new THREE.DirectionalLight(0xb0c8ff, 0.8);
	fill.position.set(-5, 2, -3);
	overlayRoot.add(fill);
	const rim = new THREE.DirectionalLight(0xffe0b0, 0.5);
	rim.position.set(0, -3, -5);
	overlayRoot.add(rim);

	// ── DOM REFS ───────────────────────────────────────────────
	const loaderOverlay  = document.getElementById('loader-overlay');
	const statusEl       = document.getElementById('status');
	const statusText     = document.getElementById('status-text');
	const nameOverlay    = document.getElementById('model-name-overlay');
	const rotateToggle   = document.getElementById('rotate-toggle');
	const walkControlsEl = document.getElementById('walk-controls');
	const walkToggle     = document.getElementById('walk-toggle');
	const walkSpeedInput = document.getElementById('walk-speed');
	const walkSpeedVal   = document.getElementById('walk-speed-val');
	const modelScaleInput = document.getElementById('model-scale');
	const modelScaleVal   = document.getElementById('model-scale-val');
	const personVideoPanelEl    = document.getElementById('person-video-panel');
	const personChromaPanelEl   = document.getElementById('person-chroma-panel');
	const personVideoButtonsRoot = document.getElementById('person-video-buttons');
	const chromaModeButtonsRoot  = document.getElementById('chroma-mode-buttons');
	const personVideoScaleInput  = document.getElementById('person-video-scale');
	const personVideoScaleVal    = document.getElementById('person-video-scale-val');
	const audioBtn      = document.getElementById('audio-btn');
	const audioStatusEl = document.getElementById('audio-status');
	const audioVolInput = document.getElementById('audio-vol');

	// ── STATE ──────────────────────────────────────────────────
	let currentModel = null;
	let currentType  = null;
	let autoRotate   = false;
	let isLoading    = false;

	let personGroup  = null;
	let personMesh   = null;
	let videoEl      = null;
	let videoTex     = null;
	let walkProgress = 0;
	let walkActive   = false;
	let personLoadGen = 0;
	/** Reference to the companion GLB attached in Monument mode. The autorotate
	 *  toggle spins THIS object in place (matches the original Monument behavior
	 *  the user said worked perfectly), instead of orbiting the camera. */
	let companionMonument = null;

	/** World-space anchor for the walk path / model placement (Potree pivot). */
	const walkOriginOffset = new THREE.Vector3();
	/** Walk path radius is multiplied so it scales with the point cloud size. */
	let walkPathScale = 1;
	/** Auto-computed scene size hint (used for picking initial model scale). */
	let sceneSizeHint = 1;
	/** Per-mode multiplier on the video billboard. Monument keeps the original
	 *  small size that fits the statue; Agriculture needs a much larger plane
	 *  so the chroma video reads against the wider point cloud surface. */
	let videoScaleBaseFactor = 0.012;
	let videoScaleBaseFloor  = 1;

	let selectedPersonVideoFile = 'video1_green_animation_senior.mp4';
	let personPreviewVideosStarted = false;
	let selectedChromaMode = 'decoded';

	const DEFAULT_CHROMA_BY_VIDEO = {
		'video1_green_animation_senior.mp4': 'decoded',
		'video2_man_sword.mp4': 'bright',
		'video3_senior_panasonic.mp4': 'native'
	};

	function syncDefaultChromaForSelectedVideo() {
		const mode = DEFAULT_CHROMA_BY_VIDEO[selectedPersonVideoFile];
		if (mode) selectedChromaMode = mode;
	}

	const PLANE_CLEARANCE = 0.05;

	/** Compute a sensible world-space anchor + scale based on point cloud bounding box. */
	function syncSceneAnchor() {
		const v = window.viewer;
		try {
			const pivot = v.scene.view.getPivot();
			if (pivot) walkOriginOffset.copy(pivot);
		} catch (_) { /* ignore */ }

		// Estimate scene size from point cloud bounding box
		try {
			const pcs = v.scene.pointclouds;
			if (pcs && pcs.length) {
				const box = new THREE.Box3();
				for (const pc of pcs) {
					const b = pc.getBoundingBoxWorld
						? pc.getBoundingBoxWorld()
						: pc.boundingBox;
					if (b) box.union(b);
				}
				if (!box.isEmpty()) {
					const sz = box.getSize(new THREE.Vector3());
					sceneSizeHint = Math.max(sz.x, sz.y, sz.z) || 1;
					// Walk path radius — kept tight so the chroma video sits close to
					// the Monument statue (was sceneSizeHint * 0.04 = roughly the model
					// size, so the video walked at the model's perimeter; ×0.012 puts
					// the resting position right next to the statue instead).
					walkPathScale = Math.max(0.4, sceneSizeHint * 0.012);
				}
			}
		} catch (_) { /* ignore */ }
	}

	window.addEventListener('potree:pointcloud-ready', syncSceneAnchor);

	function placeRootOnFloor(root, uniformScale) {
		root.scale.setScalar(uniformScale);
		root.position.set(0, 0, 0);
		root.rotation.set(0, 0, 0);
		root.updateMatrixWorld(true);
		const box = new THREE.Box3().setFromObject(root);
		const c = box.getCenter(new THREE.Vector3());
		root.position.set(-c.x, -box.min.y + PLANE_CLEARANCE, -c.z);
		root.updateMatrixWorld(true);
	}

	function setPersonChromaPanelVisible(show) {
		if (!personChromaPanelEl) return;
		personChromaPanelEl.classList.toggle('visible', !!show);
	}

	function syncPersonVideoScaleFromUI() {
		if (!personVideoScaleInput || !personVideoScaleVal) return;
		const s = parseFloat(personVideoScaleInput.value) / 10;
		personVideoScaleVal.textContent = s.toFixed(1) + '×';
		if (personGroup) {
			// Monument: videoScaleBaseFactor = 0.012 (matches the statue scale).
			// Agriculture: videoScaleBaseFactor = 0.15 (large enough to read
			// against the full point-cloud surface).
			const worldScale = s * Math.max(videoScaleBaseFloor, sceneSizeHint * videoScaleBaseFactor);
			personGroup.scale.setScalar(worldScale);
		}
	}

	function getPersonVideoPath() {
		return resolveHref('./models/' + selectedPersonVideoFile);
	}

	function markPersonVideoActiveButton() {
		personVideoButtonsRoot.querySelectorAll('.person-video-btn').forEach(btn => {
			btn.classList.toggle('active', btn.dataset.file === selectedPersonVideoFile);
		});
	}

	function markChromaModeButtons() {
		if (!chromaModeButtonsRoot) return;
		chromaModeButtonsRoot.querySelectorAll('.chroma-mode-btn').forEach(btn => {
			btn.classList.toggle('active', btn.dataset.chroma === selectedChromaMode);
		});
	}

	function reloadActivePerson() {
		const mdl = document.querySelector('.model-btn.active');
		if (!mdl || isLoading) return;
		if (mdl.dataset.type === 'monument') {
			loadMonument(mdl.dataset.name, mdl.dataset.model);
		} else if (mdl.dataset.type === 'agriculture') {
			loadAgriculture(mdl.dataset.name);
		}
	}

	function setPersonVideoPanelVisible(show) {
		if (!personVideoPanelEl) return;
		personVideoPanelEl.classList.toggle('visible', !!show);
		// Hide Video button now lives outside the video panel (sits under
		// Auto Rotate); keep its visibility tied to the same lifecycle.
		const hideBtn = document.getElementById('hide-video-btn');
		if (hideBtn) hideBtn.classList.toggle('visible', !!show);
		if (show && !personPreviewVideosStarted) {
			personPreviewVideosStarted = true;
			setupPersonVideoPreviewThumbs();
		}
	}

	function setupPersonVideoPreviewThumbs() {
		personVideoButtonsRoot.querySelectorAll('.person-video-btn').forEach(btn => {
			const vid = btn.querySelector('video');
			if (!vid || !btn.dataset.file) return;
			vid.src = resolveHref('./models/' + btn.dataset.file);

			const grabFrame = () => {
				try {
					const d = vid.duration;
					const t = d && Number.isFinite(d)
						? Math.min(0.2, Math.max(0.05, d * 0.02))
						: 0.1;
					vid.currentTime = t;
				} catch (_) { vid.currentTime = 0; }
			};

			vid.addEventListener('loadedmetadata', grabFrame, { once: true });
			vid.addEventListener('seeked', () => { vid.pause(); }, { once: true });
			vid.load();
		});
	}

	// ── AUDIO ──────────────────────────────────────────────────
	const audioEl    = new Audio(resolveHref('./models/audio1-cetatile-dacice.mp3'));
	audioEl.loop     = true;
	audioEl.volume   = 0.70;
	let audioPlaying = false;
	let walkRatePerSecond = 0.03;

	function findClosestCurveT(curve, target, samples = 720) {
		let bestT = 0;
		let bestD = Infinity;
		const tmp = new THREE.Vector3();
		for (let i = 0; i <= samples; i++) {
			const t = i / samples;
			curve.getPointAt(t, tmp);
			const d = tmp.distanceToSquared(target);
			if (d < bestD) { bestD = d; bestT = t; }
		}
		return bestT;
	}

	// ── WALKING PATH ───────────────────────────────────────────
	const walkPathAnchor = new THREE.Vector3(-4, 0, 0);
	const walkPath = new THREE.CatmullRomCurve3([
		new THREE.Vector3(-4,    0,  0),
		new THREE.Vector3(-2.5,  0,  2.5),
		new THREE.Vector3( 0,    0,  4),
		new THREE.Vector3( 2.5,  0,  2.5),
		new THREE.Vector3( 4,    0,  0),
		new THREE.Vector3( 2.5,  0, -2.5),
		new THREE.Vector3( 0,    0, -4),
		new THREE.Vector3(-2.5,  0, -2.5),
	], true, 'centripetal');
	const WALK_START_T = findClosestCurveT(walkPath, walkPathAnchor);

	const gltfLoader = new GLTFLoader();
	// crossOrigin must not be 'anonymous' for blob: URLs (belt-and-suspenders;
	// the fetch-interception fix above is the real protection).
	gltfLoader.setCrossOrigin(undefined);

	// Some three.js builds prefer ImageBitmapLoader for GLTF textures when
	// createImageBitmap exists. On several browsers / GPU stacks this is the
	// code path that produces "Couldn't load texture blob:..." for embedded
	// GLB textures. Temporarily disabling createImageBitmap during GLTF loads
	// forces the stable ImageLoader path without affecting the rest of the app.
	let _savedCreateImageBitmap = null;
	function withLegacyGLTFTextureLoading(fn) {
		const hadImageBitmap = typeof window.createImageBitmap === 'function';
		if (hadImageBitmap) {
			_savedCreateImageBitmap = window.createImageBitmap;
			window.createImageBitmap = undefined;
		}
		const restore = () => {
			if (_savedCreateImageBitmap) {
				window.createImageBitmap = _savedCreateImageBitmap;
				_savedCreateImageBitmap = null;
			}
		};
		try {
			return fn(restore);
		} catch (err) {
			restore();
			throw err;
		}
	}

	// ── CHROMA KEY MATERIAL (verbatim from tur.html) ──────────
	function injectMeshBasicChroma(shader, chromaMapFrag) {
		shader.fragmentShader = shader.fragmentShader.replace(
			'#include <common>',
			`#include <common>
uniform float threshold;
uniform float smoothing;`
		);
		shader.fragmentShader = shader.fragmentShader.replace(/^[ \t]*#include <map_fragment>/m, chromaMapFrag);
	}

	function makeChromaMaterialDecoded(tex) {
		const KEY_THRESH = 0.30;
		const KEY_SMOOTH = 0.12;

		const mat = new THREE.MeshBasicMaterial({
			map: tex,
			transparent: true,
			side: THREE.DoubleSide,
			depthWrite: false,
			toneMapped: false,
			opacity: 1,
			alphaTest: 0.05
		});

		mat.customProgramCacheKey = () => 'eyemap_chroma_decoded';

		mat.onBeforeCompile = (shader) => {
			shader.uniforms.threshold = { value: KEY_THRESH };
			shader.uniforms.smoothing = { value: KEY_SMOOTH };

			const chromaMapFrag = `#ifdef USE_MAP

	vec4 sampledDiffuseColor = texture2D( map, vMapUv );

	#ifdef DECODE_VIDEO_TEXTURE

		sampledDiffuseColor = vec4( mix( pow( sampledDiffuseColor.rgb * 0.9478672986 + vec3( 0.0521327014 ), vec3( 2.4 ) ), sampledDiffuseColor.rgb * 0.0773993808, vec3( lessThanEqual( sampledDiffuseColor.rgb, vec3( 0.04045 ) ) ) ), sampledDiffuseColor.w );

	#endif

	vec3 srgb = sampledDiffuseColor.rgb;
	vec3 lin = pow(max(srgb, vec3(0.0)), vec3(2.2));
	float eps = 0.001;
	float greenRatio = lin.g / (lin.r + lin.g + lin.b + eps);
	float luminance = dot(lin, vec3(0.2126, 0.7152, 0.0722));
	float darkMask = smoothstep(0.01, 0.08, luminance);
	float key = smoothstep(threshold - smoothing, threshold + smoothing, greenRatio);
	float alphaKey = 1.0 - key * darkMask;
	vec3 col = sampledDiffuseColor.rgb;
	float spillAmount = key * darkMask;
	col.g = mix(col.g, (col.r + col.b) * 0.5, spillAmount);

	diffuseColor.rgb *= col;
	diffuseColor.a *= alphaKey;

#endif`;

			injectMeshBasicChroma(shader, chromaMapFrag);
		};

		return mat;
	}

	function makeChromaMaterialBright(tex) {
		return new THREE.ShaderMaterial({
			glslVersion: THREE.GLSL3,
			uniforms: {
				tex:       { value: tex },
				threshold: { value: 0.30 },
				smoothing: { value: 0.12 }
			},
			vertexShader: `
				out vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
				}
			`,
			fragmentShader: `
				precision highp float;
				precision highp sampler2D;

				uniform sampler2D tex;
				uniform float threshold;
				uniform float smoothing;
				in vec2 vUv;
				out vec4 fragColor;

				vec3 toLinear(vec3 c) {
					return pow(max(c, vec3(0.0)), vec3(2.2));
				}

				void main() {
					vec4 s = texture(tex, vUv);
					vec3 lin = toLinear(s.rgb);

					float eps = 0.001;
					float greenRatio = lin.g / (lin.r + lin.g + lin.b + eps);

					float luminance = dot(lin, vec3(0.2126, 0.7152, 0.0722));
					float darkMask  = smoothstep(0.01, 0.08, luminance);

					float key   = smoothstep(threshold - smoothing,
											 threshold + smoothing,
											 greenRatio);
					float alpha = 1.0 - key * darkMask;

					if (alpha < 0.05) discard;

					vec3 col = s.rgb;
					float spillAmount = key * darkMask;
					col.g = mix(col.g, (col.r + col.b) * 0.5, spillAmount);
					col = min(col * 1.18 + vec3(0.06), vec3(1.0));

					fragColor = vec4(col, alpha);
				}
			`,
			transparent: true,
			side: THREE.DoubleSide,
			depthWrite: false,
			toneMapped: false
		});
	}

	function makeChromaMaterialNative(tex) {
		return new THREE.ShaderMaterial({
			glslVersion: THREE.GLSL3,
			uniforms: {
				tex:       { value: tex },
				threshold: { value: 0.30 },
				smoothing: { value: 0.12 }
			},
			vertexShader: `
				out vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
				}
			`,
			fragmentShader: `
				precision highp float;
				precision highp sampler2D;

				uniform sampler2D tex;
				uniform float threshold;
				uniform float smoothing;
				in vec2 vUv;
				out vec4 fragColor;

				vec3 toLinear(vec3 c) {
					return pow(max(c, vec3(0.0)), vec3(2.2));
				}

				void main() {
					vec4 s = texture(tex, vUv);
					vec3 lin = toLinear(s.rgb);

					float eps = 0.001;
					float greenRatio = lin.g / (lin.r + lin.g + lin.b + eps);

					float luminance = dot(lin, vec3(0.2126, 0.7152, 0.0722));
					float darkMask  = smoothstep(0.01, 0.08, luminance);

					float key   = smoothstep(threshold - smoothing,
											 threshold + smoothing,
											 greenRatio);
					float alpha = 1.0 - key * darkMask;

					if (alpha < 0.05) discard;

					vec3 col = s.rgb;
					float spillAmount = key * darkMask;
					col.g = mix(col.g, (col.r + col.b) * 0.5, spillAmount);

					fragColor = vec4(col, alpha);
				}
			`,
			transparent: true,
			side: THREE.DoubleSide,
			depthWrite: false,
			toneMapped: false
		});
	}

	function makeChromaMaterial(tex, mode) {
		switch (mode) {
			case 'decoded': return makeChromaMaterialDecoded(tex);
			case 'bright':  return makeChromaMaterialBright(tex);
			case 'native':  return makeChromaMaterialNative(tex);
			default:        return makeChromaMaterialDecoded(tex);
		}
	}

	// ── VIDEO PIPELINE (shared by Monument and Agriculture) ────
	// Builds the chroma-key video plane + texture and attaches it to overlayRoot.
	// `onReady` fires once the video can play and personGroup/personMesh/videoTex
	// have all been wired up; `onError` fires if the video fails to decode.
	function setupVideoPipeline(myGen, onReady, onError) {
		const videoPath = getPersonVideoPath();

		videoEl = document.createElement('video');
		// IMPORTANT: muted/playsinline/autoplay must be set BEFORE `src`. Edge
		// (and Safari) latch the autoplay-policy decision the moment the media
		// element starts loading; setting muted afterwards is too late and the
		// video never starts on first page-load. Also use `setAttribute` so
		// the attribute is reflected in the DOM (not just the IDL property),
		// which is what Edge's autoplay heuristic actually inspects.
		videoEl.muted       = true;
		videoEl.defaultMuted = true;
		videoEl.setAttribute('muted', '');
		videoEl.setAttribute('playsinline', '');
		videoEl.setAttribute('autoplay', '');
		videoEl.playsInline = true;
		videoEl.autoplay    = true;
		videoEl.loop        = true;
		videoEl.crossOrigin = 'anonymous';
		videoEl.preload     = 'auto';
		videoEl.src         = videoPath;

		// Belt-and-suspenders play attempts. `canplay` fires once the browser
		// thinks it can begin playback; `canplaythrough` fires when buffering
		// is enough for uninterrupted play. Either is a valid autoplay moment.
		const tryPlay = () => {
			if (!videoEl) return;
			const p = videoEl.play();
			if (p && typeof p.catch === 'function') p.catch(() => {});
		};

		videoEl.addEventListener('canplaythrough', tryPlay);
		videoEl.addEventListener('loadeddata',     tryPlay);

		// First user gesture anywhere on the page — picks up any video the
		// browser refused to autoplay, regardless of which mode loaded it.
		registerAutoplayUnlock(() => { if (videoEl) tryPlay(); });

		videoEl.addEventListener('canplay', () => {
			if (myGen !== personLoadGen) return;

			tryPlay();

			videoTex = new THREE.VideoTexture(videoEl);
			videoTex.minFilter  = THREE.LinearFilter;
			videoTex.magFilter  = THREE.LinearFilter;
			videoTex.format     = THREE.RGBAFormat;
			videoTex.colorSpace = THREE.SRGBColorSpace;

			const aspect = (videoEl.videoHeight || 1080) / (videoEl.videoWidth || 1920);
			const planeH = 2.0;
			const planeW = planeH / aspect;

			const geo = new THREE.PlaneGeometry(planeW, planeH);
			const mat = makeChromaMaterial(videoTex, selectedChromaMode);
			personMesh = new THREE.Mesh(geo, mat);
			personMesh.userData.isPersonVideoPlane = true;
			personMesh.position.y = planeH / 2 + PLANE_CLEARANCE;

			personGroup = new THREE.Group();
			personGroup.add(personMesh);
			overlayRoot.add(personGroup);

			currentModel = personGroup;
			currentType  = 'person';
			walkProgress = WALK_START_T;
			syncPersonVideoScaleFromUI();
			placePersonOnPath();
			resetVideoVisibility();

			if (onReady) onReady();
		}, { once: true });

		videoEl.addEventListener('error', () => {
			if (myGen !== personLoadGen) return;
			if (onError) onError();
		}, { once: true });

		videoEl.load();
	}

	// ── LOAD MONUMENT (chroma video billboard + statue GLB) ────
	// Hides the point cloud, drops the statue at the cloud pivot, and orbits the
	// video plane around it. Camera focuses on the statue (not the video) so user
	// rotation pivots on the statue instead of the moving billboard.
	function loadMonument(displayName, extraModelPath) {
		const myGen = ++personLoadGen;
		isLoading = true;
		// Restore the original Monument video size — the Agriculture path may
		// have bumped these up to read against the larger point cloud.
		videoScaleBaseFactor = 0.012;
		videoScaleBaseFloor  = 1;
		clearScene();
		syncSceneAnchor();
		// Cloud is hidden in Monument mode, but reset its rotation so it's
		// clean if the user switches back to Agriculture later.
		resetPotreePointcloudsRotation();
		hidePotreePointclouds();
		walkControlsEl.classList.remove('visible');
		setPersonVideoPanelVisible(false);
		setPersonChromaPanelVisible(false);
		loaderOverlay.classList.add('visible');
		setStatus('loading', extraModelPath ? 'LOADING MODEL...' : 'LOADING VIDEO...');

		// Reveal the now-loaded video + companion + controls in one go. Called
		// after BOTH the chroma video and the companion GLB are ready (or the
		// GLB has decisively failed). Keeps the user on the spinner the entire
		// time so they never see a half-loaded scene (video alone for the
		// 1-2 seconds before the statue arrives).
		const finalizeMonument = (companionObj) => {
			if (myGen !== personLoadGen) return;
			if (personGroup) personGroup.visible = !videoHidden;
			walkControlsEl.classList.add('visible');
			setPersonVideoPanelVisible(true);
			setPersonChromaPanelVisible(true);
			loaderOverlay.classList.remove('visible');
			setStatus('ready', (displayName || 'MONUMENT').toUpperCase());
			nameOverlay.textContent = displayName || 'Monument';
			isLoading = false;
			focusPotreeCameraOnObject(companionObj || personGroup);
		};

		setupVideoPipeline(myGen, () => {
			if (extraModelPath) {
				// Hide the freshly-built video plane until the GLB statue lands.
				if (personGroup) personGroup.visible = false;
				setStatus('loading', 'LOADING MODEL...');

				withLegacyGLTFTextureLoading((restoreCreateImageBitmap) => {
					gltfLoader.load(resolveHref(extraModelPath), (gltf) => {
						restoreCreateImageBitmap();
						if (myGen !== personLoadGen) return;
						const m = gltf.scene;
						const box = new THREE.Box3().setFromObject(m);
						const sz  = box.getSize(new THREE.Vector3());
						const targetSize = Math.max(2.5, sceneSizeHint * 0.04);
						const sc  = targetSize / Math.max(sz.x, sz.y, sz.z);
						placeRootOnFloor(m, sc);
						m.position.add(worldToOverlayLocal(walkOriginOffset));
						m.userData.isCompanionModel = true;
						overlayRoot.add(m);
						companionMonument = m;
						finalizeMonument(m);
					}, undefined, (err) => {
						restoreCreateImageBitmap();
						if (myGen !== personLoadGen) return;
						console.warn('Companion model failed:', err);
						// Reveal what we have (video alone) so the user isn't stuck.
						finalizeMonument(null);
					});
				});
			} else {
				finalizeMonument(null);
			}
		}, () => {
			loaderOverlay.classList.remove('visible');
			setStatus('error', 'VIDEO LOAD FAILED');
			isLoading = false;
		});
	}

	function placePersonOnPath() {
		if (!personGroup) return;
		const tmp = new THREE.Vector3();
		walkPath.getPointAt(walkProgress, tmp);
		tmp.multiplyScalar(walkPathScale).add(worldToOverlayLocal(walkOriginOffset));
		personGroup.position.copy(tmp);
	}

	/** Reposition the Potree camera so a freshly loaded overlay object is centered + framed. */
	function focusPotreeCameraOnObject(obj) {
		try {
			obj.updateMatrixWorld(true);
			const box = new THREE.Box3().setFromObject(obj);
			if (box.isEmpty()) return;
			const center  = box.getCenter(new THREE.Vector3());
			const size    = box.getSize(new THREE.Vector3());
			const maxSize = Math.max(size.x, size.y, size.z);

			const view = window.viewer.scene.view;
			const cam  = window.viewer.scene.getActiveCamera();
			if (!cam) return;

			const fov = (cam.fov || 60) * Math.PI / 180;
			const dist = (maxSize / (2 * Math.tan(fov / 2))) * 2.0;

			const fwd = new THREE.Vector3();
			cam.getWorldDirection(fwd);
			if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1);
			fwd.normalize();

			view.position.copy(center).addScaledVector(fwd, -dist);
			view.radius = dist;
			zoomAnchorPivot = null; // next slider drag re-anchors at this new pivot
		} catch (_) {}
	}

	// ── LOAD GLB ───────────────────────────────────────────────
	function loadModel(path, name) {
		if (isLoading) return;
		isLoading = true;
		clearScene();
		syncSceneAnchor();
		hidePotreePointclouds();
		walkControlsEl.classList.remove('visible');
		setPersonVideoPanelVisible(false);
		setPersonChromaPanelVisible(false);
		loaderOverlay.classList.add('visible');
		setStatus('loading', 'LOADING...');

		withLegacyGLTFTextureLoading((restoreCreateImageBitmap) => {
			gltfLoader.load(resolveHref(path), (gltf) => {
				restoreCreateImageBitmap();
				const model  = gltf.scene;
				const box    = new THREE.Box3().setFromObject(model);
				const size   = box.getSize(new THREE.Vector3());
				const targetSize = Math.max(2.5, sceneSizeHint * 0.04);
				const normScale  = targetSize / Math.max(size.x, size.y, size.z);

				placeRootOnFloor(model, normScale);
				model.position.add(worldToOverlayLocal(walkOriginOffset));

				overlayRoot.add(model);
				currentModel = model;
				currentType  = 'model';

				loaderOverlay.classList.remove('visible');
				setStatus('ready', name.toUpperCase());
				nameOverlay.textContent = name;
				focusPotreeCameraOnObject(model);
				isLoading = false;
			}, undefined, (err) => {
				restoreCreateImageBitmap();
				console.error(err);
				loaderOverlay.classList.remove('visible');
				setStatus('error', 'LOAD FAILED');
				isLoading = false;
			});
		});
	}

	// ── CLEAR SCENE / RESOURCE DISPOSAL ────────────────────────
	// Every PBR / shader / video texture slot we want to release on model swap.
	// NOTE: 'envMap' is intentionally excluded — scene.environment (the PMREM IBL)
	// is shared across every model, and disposing it once would break every subsequent load.
	const TEXTURE_SLOT_KEYS = [
		'map', 'alphaMap', 'aoMap', 'bumpMap', 'displacementMap',
		'emissiveMap', 'lightMap', 'metalnessMap',
		'normalMap', 'roughnessMap', 'specularMap',
		'clearcoatMap', 'clearcoatNormalMap', 'clearcoatRoughnessMap',
		'transmissionMap', 'thicknessMap',
		'sheenColorMap', 'sheenRoughnessMap', 'iridescenceMap'
	];

	function disposeMaterial(m) {
		if (!m) return;
		// Dispose every texture slot on the material — but DON'T null the property,
		// because three.js' renderer reads those refs from its `dispose` event handler.
		for (const key of TEXTURE_SLOT_KEYS) {
			const t = m[key];
			if (t && typeof t.dispose === 'function') {
				try { t.dispose(); } catch (_) {}
			}
		}
		if (m.uniforms) {
			for (const k of Object.keys(m.uniforms)) {
				const u = m.uniforms[k];
				if (u && u.value && typeof u.value.dispose === 'function') {
					try { u.value.dispose(); } catch (_) {}
				}
			}
		}
		try { m.dispose(); } catch (_) {}
	}

	function disposeObject3D(obj) {
		obj.traverse(c => {
			if (c.geometry && typeof c.geometry.dispose === 'function') {
				try { c.geometry.dispose(); } catch (_) {}
			}
			if (c.material) {
				[].concat(c.material).forEach(disposeMaterial);
			}
		});
	}

	function clearScene() {
		// Remove + dispose any companion GLBs that got attached alongside a person
		const removeList = [];
		overlayRoot.traverse(obj => { if (obj.userData.isCompanionModel) removeList.push(obj); });
		removeList.forEach(obj => {
			overlayRoot.remove(obj);
			disposeObject3D(obj);
		});
		companionMonument = null;

		// Remove + dispose the active model / person group
		if (currentModel) {
			overlayRoot.remove(currentModel);
			disposeObject3D(currentModel);
			currentModel = null;
		}

		// Tear down chroma-key video pipeline
		videoTex = null;
		if (videoEl) {
			try {
				videoEl.pause();
				videoEl.removeAttribute('src');
				videoEl.load();
			} catch (_) {}
			videoEl = null;
		}
		personGroup = null;
		personMesh  = null;
		currentType = null;

		// Drop renderer-side caches so freed textures actually leave the GPU
		try { overlayRenderer.renderLists.dispose(); } catch (_) {}

		stopAudio();
	}

	// ── LOAD AGRICULTURE (Potree point cloud + chroma video overlay) ──
	// Re-shows the point cloud(s), refits the Potree camera on them, and ALSO
	// builds the same chroma-key video pipeline the Monument uses, so the user
	// has the full video panel + chroma options + walk controls + Hide Video
	// toggle on top of the cloud. The orbit pivot stays on the cloud (we never
	// call focusPotreeCameraOnObject), so dragging rotates around the cloud.
	function loadAgriculture(displayName) {
		if (isLoading) return;
		const myGen = ++personLoadGen;
		isLoading = true;
		// Bigger billboard for Agriculture — the point cloud spans a much wider
		// area than the Monument statue, so the Monument-scale video would be
		// invisible against it. Tuned to occupy a meaningful fraction of the
		// cloud's footprint without overwhelming it.
		videoScaleBaseFactor = 0.15;
		videoScaleBaseFloor  = 3;

		// If the cloud is already visible (e.g. fresh page load, or chroma-mode
		// swap while in Agriculture) we must NOT call fitToScreen() — it would
		// snap the camera back and undo any zoom/pan the user has done.
		const pcs = (window.viewer && window.viewer.scene && window.viewer.scene.pointclouds) || [];
		const cloudWasVisible = pcs.length > 0 && pcs.every(p => p.visible !== false);

		clearScene();
		walkControlsEl.classList.remove('visible');
		setPersonVideoPanelVisible(false);
		setPersonChromaPanelVisible(false);
		loaderOverlay.classList.add('visible');
		setStatus('loading', 'POINT CLOUD...');

		showPotreePointclouds();
		// Reset any leftover spin from a previous Agriculture session so the
		// cloud comes back upright (the rotation matrix from autorotate is
		// persistent across navigation).
		resetPotreePointcloudsRotation();
		if (!cloudWasVisible) {
			try { window.viewer.fitToScreen(); } catch (_) {}
		}

		// Anchor refresh runs against the now-visible cloud (pivot, sceneSizeHint)
		syncSceneAnchor();
		zoomAnchorPivot = null;

		setupVideoPipeline(myGen, () => {
			walkControlsEl.classList.add('visible');
			setPersonVideoPanelVisible(true);
			setPersonChromaPanelVisible(true);
			loaderOverlay.classList.remove('visible');
			setStatus('ready', (displayName || 'AGRICULTURE').toUpperCase());
			nameOverlay.textContent = displayName || 'Agriculture';
			isLoading = false;
		}, () => {
			// Video failed but the cloud is still up — leave the user with the cloud.
			loaderOverlay.classList.remove('visible');
			setStatus('ready', (displayName || 'AGRICULTURE').toUpperCase());
			nameOverlay.textContent = displayName || 'Agriculture';
			isLoading = false;
		});
	}

	// ── SIDEBAR BUTTONS ────────────────────────────────────────
	document.querySelectorAll('.model-btn').forEach(btn => {
		btn.addEventListener('click', () => {
			if (btn.classList.contains('active') || isLoading) return;
			document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
			btn.classList.add('active');

			if (btn.dataset.type === 'monument') {
				loadMonument(btn.dataset.name, btn.dataset.model);
			} else if (btn.dataset.type === 'agriculture') {
				loadAgriculture(btn.dataset.name);
			}
		});
	});

	// ── HIDE / SHOW VIDEO TOGGLE ───────────────────────────────
	// Lives inside the video panel — flips personGroup.visible without tearing
	// down the video pipeline, so the same clip can be brought back instantly.
	const hideVideoBtn = document.getElementById('hide-video-btn');
	let videoHidden = false;

	function resetVideoVisibility() {
		videoHidden = false;
		if (hideVideoBtn) {
			hideVideoBtn.textContent = 'Hide Video';
			hideVideoBtn.classList.remove('hidden-state');
		}
	}

	if (hideVideoBtn) {
		hideVideoBtn.addEventListener('click', () => {
			if (!personGroup) return;
			videoHidden = !videoHidden;
			personGroup.visible = !videoHidden;
			hideVideoBtn.textContent = videoHidden ? 'Show Video' : 'Hide Video';
			hideVideoBtn.classList.toggle('hidden-state', videoHidden);
		});
	}

	// ── CONTROLS ───────────────────────────────────────────────
	rotateToggle.addEventListener('change', () => { autoRotate = rotateToggle.checked; });
	walkToggle.addEventListener('change',   () => { walkActive  = walkToggle.checked; });

	// Pivot captured at the start of a slider drag. We anchor against this
	// fixed point and update BOTH view.position and view.radius — otherwise
	// view.getPivot() (= position + direction * radius) drifts with the camera
	// each input event and the slider only ever zooms out.
	let zoomAnchorPivot = null;

	function captureZoomAnchor() {
		try {
			const view = window.viewer.scene.view;
			const p = view.getPivot();
			if (p) zoomAnchorPivot = p.clone();
		} catch (_) {}
	}

	function applyZoomFromSlider() {
		const zoomMul = Math.max(0.35, parseFloat(modelScaleInput.value) / 10);
		modelScaleVal.textContent = zoomMul.toFixed(1) + '×';
		try {
			if (!zoomAnchorPivot) captureZoomAnchor();
			if (!zoomAnchorPivot) return;

			const view = window.viewer.scene.view;
			const cam  = window.viewer.scene.getActiveCamera();
			if (!cam) return;

			// Camera's current forward direction (unit vector pointing where it looks)
			const fwd = new THREE.Vector3();
			cam.getWorldDirection(fwd);
			if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1);
			fwd.normalize();

			const baseDist    = (sceneSizeHint || 1) * 1.2;
			const desiredDist = baseDist / zoomMul;

			// position = anchor - forward * dist  →  getPivot() stays equal to anchor.
			view.position.copy(zoomAnchorPivot).addScaledVector(fwd, -desiredDist);
			view.radius = desiredDist;
		} catch (_) {}
	}

	modelScaleInput.addEventListener('input',       applyZoomFromSlider);
	modelScaleInput.addEventListener('pointerdown', captureZoomAnchor);
	modelScaleInput.addEventListener('touchstart',  captureZoomAnchor);
	modelScaleInput.addEventListener('pointerup',   () => { zoomAnchorPivot = null; });
	modelScaleInput.addEventListener('pointercancel', () => { zoomAnchorPivot = null; });
	modelScaleInput.addEventListener('touchend',     () => { zoomAnchorPivot = null; });
	modelScaleInput.addEventListener('change',       () => { zoomAnchorPivot = null; });

	if (personVideoScaleInput) {
		personVideoScaleInput.addEventListener('input', syncPersonVideoScaleFromUI);
	}

	personVideoButtonsRoot.querySelectorAll('.person-video-btn').forEach(pvBtn => {
		pvBtn.addEventListener('click', () => {
			if (pvBtn.classList.contains('active')) return;
			selectedPersonVideoFile = pvBtn.dataset.file;
			syncDefaultChromaForSelectedVideo();
			markPersonVideoActiveButton();
			markChromaModeButtons();

			reloadActivePerson();
		});
	});

	syncDefaultChromaForSelectedVideo();
	markPersonVideoActiveButton();
	markChromaModeButtons();

	if (chromaModeButtonsRoot) {
		chromaModeButtonsRoot.querySelectorAll('.chroma-mode-btn').forEach(cmBtn => {
			cmBtn.addEventListener('click', () => {
				if (cmBtn.classList.contains('active')) return;
				selectedChromaMode = cmBtn.dataset.chroma;
				markChromaModeButtons();
				reloadActivePerson();
			});
		});
	}

	function updateWalkRateFromSlider() {
		walkRatePerSecond = parseFloat(walkSpeedInput.value) * 0.006;
		walkSpeedVal.textContent = walkSpeedInput.value;
	}
	walkSpeedInput.addEventListener('input', updateWalkRateFromSlider);
	updateWalkRateFromSlider();

	// ── AUDIO ──────────────────────────────────────────────────
	function stopAudio() {
		audioEl.pause();
		audioEl.currentTime = 0;
		audioPlaying = false;
		audioBtn.textContent = '▶';
		audioBtn.classList.remove('playing');
		audioStatusEl.textContent = 'STOPPED';
		audioStatusEl.classList.remove('active');
	}

	audioBtn.addEventListener('click', () => {
		if (audioPlaying) {
			stopAudio();
		} else {
			audioEl.play().then(() => {
				audioPlaying = true;
				audioBtn.textContent = '⏹';
				audioBtn.classList.add('playing');
				audioStatusEl.textContent = 'PLAYING';
				audioStatusEl.classList.add('active');
			}).catch(err => {
				console.warn('Audio play failed:', err);
				audioStatusEl.textContent = 'ERROR';
			});
		}
	});

	audioVolInput.addEventListener('input', () => {
		audioEl.volume = parseFloat(audioVolInput.value) / 100;
	});

	// ── ANIMATION LOOP ─────────────────────────────────────────
	const clock = new THREE.Clock();

	function syncCameraFromPotree() {
		try {
			const pCam = window.viewer.scene.getActiveCamera();
			if (!pCam) return;
			overlayCamera.position.copy(pCam.position);
			overlayCamera.quaternion.copy(pCam.quaternion);
			overlayCamera.fov    = pCam.fov || overlayCamera.fov;
			overlayCamera.aspect = pCam.aspect || overlayCamera.aspect;
			overlayCamera.near   = pCam.near || overlayCamera.near;
			overlayCamera.far    = pCam.far  || overlayCamera.far;
			overlayCamera.updateProjectionMatrix();
		} catch (_) {}
	}

	function animate() {
		requestAnimationFrame(animate);
		const delta = clock.getDelta();

		// Auto-rotate spins the actual subject in place around its vertical axis
		// (turntable feel), instead of orbiting the camera.
		//   • Monument: rotate the companion statue's local Y (== world Z after
		//     overlayRoot's X/2 rotation). This is the original Monument behavior.
		//   • Agriculture: rotate the Potree pointcloud(s) around their bbox
		//     centers via direct matrix premultiply, so the cloud spins on its
		//     axis instead of tumbling around its octree origin (a corner).
		if (autoRotate) {
			const angle = delta * 0.4;
			if (companionMonument) {
				companionMonument.rotation.y += angle;
			} else {
				rotatePotreePointcloudsAroundCenter(angle);
			}
		}

		syncCameraFromPotree();

		if (currentType === 'person' && personGroup && personMesh) {
			if (videoTex) videoTex.needsUpdate = true;

			if (walkActive) {
				walkProgress = ((walkProgress + walkRatePerSecond * delta) % 1 + 1) % 1;
			}

			placePersonOnPath();

			// Billboard — face camera, stay upright on local Y (== world Z)
			const camLocal = worldToOverlayLocal(overlayCamera.position);
			const dir = new THREE.Vector3().subVectors(camLocal, personGroup.position);
			dir.y = 0;
			if (dir.lengthSq() > 0.0001) {
				personGroup.rotation.y = Math.atan2(dir.x, dir.z);
			}
		}

		overlayRenderer.render(overlayScene, overlayCamera);
	}
	animate();

	// ── RESIZE ─────────────────────────────────────────────────
	function resizeOverlay() {
		const w = wrap.clientWidth, h = wrap.clientHeight;
		overlayCamera.aspect = w / Math.max(1, h);
		overlayCamera.updateProjectionMatrix();
		overlayRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
		overlayRenderer.setSize(w, h);
	}
	window.addEventListener('resize', resizeOverlay);

	// Click-to-log path helper — emits a coord in the same Y-up local frame the walkPath uses,
	// expressed relative to the current walk anchor (so coords paste straight into walkPath).
	window.addEventListener('click', () => {
		if (currentType === 'person') {
			const camLocal = worldToOverlayLocal(overlayCamera.position);
			const origin   = worldToOverlayLocal(walkOriginOffset);
			const rel = camLocal.clone().sub(origin);
			if (walkPathScale > 0) rel.divideScalar(walkPathScale);
			console.log(
				`%c[PATH POINT]  new THREE.Vector3(${rel.x.toFixed(2)}, 0, ${rel.z.toFixed(2)}),`,
				'color:#a855f7;font-weight:bold'
			);
		}
	});

	function setStatus(type, text) {
		statusEl.className     = type;
		statusText.textContent = text;
	}

	setStatus('ready', 'POINT CLOUD READY');

	// ── AUTO-LOAD AGRICULTURE ON INITIAL CLOUD-READY ───────────
	// Without this, the cloud appears via the original Potree init script but
	// (a) no menu item is highlighted, (b) syncSceneAnchor never runs so the
	// zoom slider's baseDist stays at 1, making "1.0× → 4.0×" snap the camera
	// inside the cloud, and (c) the chroma video isn't loaded. By simulating
	// a click on the Agriculture button we go through the exact same code path
	// as a manual menu click, so initial state == post-click state.
	let hasAutoLoadedAgriculture = false;
	function maybeAutoLoadAgriculture() {
		if (hasAutoLoadedAgriculture || isLoading) return;
		if (!window.viewer || !window.viewer.scene) return;
		const pcs = window.viewer.scene.pointclouds;
		if (!pcs || pcs.length === 0) return;
		const btn = document.querySelector('.model-btn[data-type="agriculture"]');
		if (!btn) return;
		hasAutoLoadedAgriculture = true;
		if (!btn.classList.contains('active')) btn.click();
	}
	window.addEventListener('potree:pointcloud-ready', maybeAutoLoadAgriculture);
	maybeAutoLoadAgriculture(); // immediate try (in case the cloud already finished)
	const autoLoadPoll = setInterval(() => {
		if (hasAutoLoadedAgriculture) { clearInterval(autoLoadPoll); return; }
		maybeAutoLoadAgriculture();
	}, 200);
	setTimeout(() => clearInterval(autoLoadPoll), 30000);

	} /* end initOverlay */
	</script>


  </body>
</html>
